name: Python lint

concurrency:
  group: python-lint-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  ruff:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ruff
        # Pinned so that a new ruff release does not turn the check red on its own.
        run: pip install ruff==0.17.1
      - name: Lint
        run: ruff check .
